<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Seguro | CromIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-white flex flex-col h-screen relative overflow-hidden">
    
    <!-- Background Effects -->
    <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-emerald-600/10 rounded-full blur-[100px] pointer-events-none"></div>

    <nav class="p-6 relative z-10">
        <a href="/" class="text-gray-400 hover:text-white transition-colors text-sm font-medium flex items-center gap-2">
            ← Voltar para o Início
        </a>
    </nav>

    <div class="flex-grow flex items-center justify-center relative z-10 px-4">
        <div class="bg-gray-900/80 backdrop-blur-xl p-10 rounded-2xl shadow-[0_0_40px_rgba(0,0,0,0.5)] w-full max-w-md border border-gray-800">
            <div class="text-center mb-8">
                <div class="inline-block p-3 rounded-full bg-blue-500/10 border border-blue-500/20 mb-4">
                    <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" />
                    </svg>
                </div>
                <h1 class="text-3xl font-bold mb-2">Bem-vindo de volta</h1>
                <p class="text-gray-400 text-sm">Acesse seu painel de controle e faturamento.</p>
            </div>
            
            <form action="/login" method="POST" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2" for="username">Usuário</label>
                    <input type="text" id="username" name="username" required 
                        class="w-full px-4 py-3 bg-gray-950/50 border border-gray-700 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-white placeholder-gray-500"
                        placeholder="Ex: pedrodev">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2" for="password">Senha</label>
                    <input type="password" id="password" name="password" required 
                        class="w-full px-4 py-3 bg-gray-950/50 border border-gray-700 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-white placeholder-gray-500"
                        placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 rounded-xl font-bold text-white shadow-lg shadow-blue-500/25 transition-all transform hover:-translate-y-0.5">
                    Autenticar
                </button>
            </form>
            
            <p class="text-center text-xs text-gray-500 mt-8">
                Problemas de acesso? Solicite reset de senha no canal do Discord.
            </p>
        </div>
    </div>
</body>
</html>
